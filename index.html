<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VandorNetwork</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #0f1117;
            color: white;
        }

        header {
            background: #171b24;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            color: #55ff55;
            font-size: 3rem;
        }

        nav {
            background: #10141d;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
        }

        <h1>VandorNetwork</h1>

        .hero {
            text-align: center;
            padding: 120px 20px;
        }

        .hero h2 {
            font-size: 2.5rem;
            margin-bottom: 15px;
        }

        .hero p {
            color: #bdbdbd;
            margin: 10px 0;
        }

        .store {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
            padding: 50px;
        }

        .card {
            background: #1a1f2b;
            width: 250px;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
        }

        .card h3 {
            margin-bottom: 10px;
        }

        .price {
            color: #55ff55;
            font-size: 1.5rem;
            margin: 15px 0;
        }

        button {
            background: #55ff55;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        footer {
            text-align: center;
            padding: 20px;
            background: #171b24;
            margin-top: 50px;
        }
    </style>
</head>
<body>

<header>
    <h1>VandorNetwork</h1>
</header>

<nav>
    <a href="#">Home</a>
    <a href="#">Store</a>
    <a href="https://discord.gg/jgZXqYFjNd">Discord</a>
    <a href="#">Rules</a>
</nav>

<section class="hero">
    <h2>Welcome to VandorNetwork</h2>
    <p>Custom Minecraft Network</p>

    <p><strong>Java:</strong> olds-thereon.tun.ply.gg</p>
    <p><strong>Bedrock:</strong> ambulance-almost.tun.ply.gg:59197</p>
</section>

<section class="store">

    <div class="card">
        <h3>VIP</h3>
        <div class="price">$4.99</div>
        <button>Buy Now</button>
    </div>

    <div class="card">
        <h3>MVP</h3>
        <div class="price">$9.99</div>
        <button>Buy Now</button>
    </div>

    <div class="card">
        <h3>LEGEND</h3>
        <div class="price">$19.99</div>
        <button>Buy Now</button>
    </div>

</section>

<footer>
    Join our Discord: https://discord.gg/jgZXqYFjNd
</footer>

</body>
</html>
